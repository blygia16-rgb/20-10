<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng Ngày Phụ nữ Việt Nam 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
            animation: popup 0.8s ease-out forwards;
        }

        @keyframes popup {
            to {
                transform: scale(1);
            }
        }

        h1 {
            color: #d63384;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .wish-box {
            background: #fff0f5;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #d63384;
            margin-bottom: 25px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wish-text {
            color: #4a4a4a;
            font-size: 1.05rem;
            line-height: 1.6;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.3s ease;
            outline: none;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .heart {
            position: absolute;
            color: #ff4b2b;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Women's Day!</h1>
        <div class="subtitle">🌸 Chúc Mừng Chị Hà Anh Ngày 20/10 🌸</div>

        <div class="wish-box">
            <p class="wish-text" id="wish">Bấm vào nút bên dưới để nhận biết bí mật bên trong nhé!🩷</p>
        </div>

        <button class="btn" onclick="nextWish()">Nhận lời chúc 💖</button>
    </div>

    <script>
        const wishes = [
            "Chúc chị một ngày 20/10 thật nhiều niềm vui, hạnh phúc và luôn tràn đầy năng lượng tích cực! ✨",
            "Chúc chị luôn xinh đẹp, rạng rỡ và thành công trên con đường mình đã chọn! 🌷",
            "Mong rằng mỗi ngày của chị đều tràn ngập nụ cười, tình yêu thương và sự may mắn! 💕",
            "Cảm ơn chị vì đã luôn tuyệt vời và tỏa sáng theo cách riêng của mình. chúc 20/10 nha chị yêu! 💐",
            "Chúc chị nhận được thật nhiều hoa, quà và những lời chúc ngọt ngào nhất trong ngày 20/10! 🎁"
            "Em Yêu chị nhiều lắm đó"
            "chúc chị 20/10 vui vẻ:3"
        ];

        let currentIndex = 0;

        function nextWish() {
            const wishElement = document.getElementById('wish');
            wishElement.style.opacity = 0;
            
            setTimeout(() => {
                wishElement.textContent = wishes[currentIndex];
                wishElement.style.transition = 'opacity 0.5s';
                wishElement.style.opacity = 1;
                currentIndex = (currentIndex + 1) % wishes.length;
            }, 300);

            createHearts(5);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const icons = ['❤️', '💖', '🌸', '💐', '💕', '✨','🌻','🩷',🌼','🪷','🌹','🌺','🪻','🏵️'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        function createHearts(quantity) {
            for (let i = 0; i < quantity; i++) {
                setTimeout(createHeart, i * 100);
            }
        }

        setInterval(createHeart, 400);
    </script>
</body>
</html>
